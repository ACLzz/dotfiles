version: '3'

tasks:
  default:
    - task: update
  update:
    silent: true
    desc: Fetches latest version from git adopting local changes
    cmds:
      - git stash
      - git fetch
      - git pull
      - git stash pop
      - task: install

  install:
    silent: true
    desc: Installs dotfiles and related userspace software
    cmds:
      - task: _install:oh-my-zsh
      - task: _install:zsh-autosuggestions
      - task: _install:space_backgrounds
      - task: _stow
      - task: _chsh

  install:apt:
    desc: Installs global software for apt-based distributives. Must be run as
      superuser
    preconditions:
      - test `whoami` = "root"
    cmds:
      - apt update
      - |
        apt install -y \
          alacritty gammastep sway mako-notifier tofi wireplumber xdg-desktop-portal-wlr slurp \
          wl-clipboard zsh zoxide bibata-cursor-theme stow cowsay wget vim coreutils

  install:apt:extra:
    desc: Installs extra global software for apt-based distributives. Must be run as
      superuser
    preconditions:
      - test `whoami` = "root"
    cmds:
      - apt update
      - apt install -y sunshine

  extra:second_monitor:add:
    desc: Enables support for second monitor
    vars:
      SECOND_MONITOR_CONFIG_PATH: .config/sway/config.d/second_monitor
    cmds:
      - sed '/.*second_monitor/D' .stow-local-ignore > .stow-local-ignore
      - echo "include ~/$SECOND_MONITOR_CONFIG_PATH" >> .config/sway/config
    #status:
    #  - test -z `cat .stow-local-ignore | grep $SECOND_MONITOR_CONFIG_PATH`

  extra:second_monitor:remove:
    desc: Disables support for second monitor
    vars:
      SECOND_MONITOR_CONFIG_PATH: .config/sway/config.d/second_monitor
    cmds:
      - sed '/.*second_monitor/D' .config/sway/config > .config/sway/config
      - echo $SECOND_MONITOR_CONFIG_PATH >> .stow-local-ignore
    status:
      - cat .stow-local-ignore | grep $SECOND_MONITOR_CONFIG_PATH | test 

  _chsh:
    silent: true
    cmds:
      - echo "Don't be scared, just changing your sh to zsh :)"
      - chsh `whoami` -s /bin/zsh
    status:
      - echo $SHELL | grep zsh

  _install:oh-my-zsh:
    silent: true
    cmd: sh -c "$(wget -O-
      https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
      "" --unattended --keep-zshrc
    status:
      - test -d ~/.oh-my-zsh

  _install:zsh-autosuggestions:
    silent: true
    vars:
      TARGET_DIR: ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions
    cmd: git clone https://github.com/zsh-users/zsh-autosuggestions {{.TARGET_DIR}}
    status:
      - test -d {{.TARGET_DIR}}

  _install:space_backgrounds:
    silent: true
    vars:
      TARGET_DIR: ~/.local/bin
      TARGET_FILE: "{{.TARGET_DIR}}/space_backgrounds"
    cmds:
      - mkdir -p {{.TARGET_DIR}}
      - wget -O {{.TARGET_FILE}}
        https://github.com/Muneeb1195/PixelSpace/releases/download/v0.1.0-rc/SpaceBackground-linux.x86_64
      - chmod +x {{.TARGET_FILE}}
    status:
      - test -f {{.TARGET_FILE}}

  _stow:
    silent: true
    deps:
      - task: _stow:backup_conflicts
    cmd: stow .

  _stow:backup_conflicts:
    silent: false
    vars:
      CONFLICTS:
        sh: stow --simulate . 2>&1 | grep "cannot stow" |  sed -E 's/.*existing target //g' | 
          sed -E 's/ since neither.*//g' | sed -E 's/^[[:space:][:alnum:]_]*\//\.\.\//gm' | 
          tr '\n' ' '
    cmd: |
      for f in {{.CONFLICTS}}; do
        echo "$f file in conflict with dotfiles will be backed up"
        mv "$f" "$f.bak"
      done
    status:
      - test "{{.CONFLICTS}}" = ""
